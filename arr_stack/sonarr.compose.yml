services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ${BASE_PATH}/sonarr/data:/config
      - ${BASE_PATH}/jellyfin/tvseries:/tv 
      - ${BASE_PATH}/downloads:/downloads
    ports:
      - 8989:8989
    restart: unless-stopped