services:
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ${BASE_PATH}/radarr/data:/config
      - ${BASE_PATH}/jellyfin/movies:/movies #optional
      - ${BASE_PATH}/downloads:/downloads #optional
    ports:
      - 7878:7878
    restart: unless-stopped