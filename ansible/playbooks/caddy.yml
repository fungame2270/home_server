- name: Deploy Caddy Reverse Proxy on Alpine LXC
  hosts: caddy
  gather_facts: false

  tasks:
    - name: Install Caddy
      ansible.builtin.raw: >
        apk update && apk add --no-cache caddy
      changed_when: false

    - name: Deploy Caddy configuration
      ansible.builtin.template:
        src: "../config/caddy/Caddyfile.j2"
        dest: "/etc/caddy/Caddyfile"
        mode: '0644'
        validate: "/usr/sbin/caddy validate --config %s --adapter caddyfile"
      notify: Restart Caddy

    - name: start caddy service
      ansible.builtin.service:
        name: caddy
        enabled: true
        state: started
    
  
  handlers:
    - name: Restart Caddy
      ansible.builtin.service:
        name: caddy
        state: restarted