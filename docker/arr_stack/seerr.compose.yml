services:
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    environment:
      - LOG_LEVEL=info
      - TZ=Europe/Lisbon
      - PORT=5055 #optional
    ports:
      - 5055:5055
    volumes:
      - ${BASE_PATH}/overseerr/config:/app/config
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    restart: unless-stopped